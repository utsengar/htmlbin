name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded PR runs but never cancel a main deploy mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Fail the build on any high-or-critical runtime dependency
      # vulnerability. Dev-only deps don't ship to the Worker so they
      # don't gate the build.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      # ───── main → production ───────────────────────────────────────
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy

      # ───── PR → versioned preview ──────────────────────────────────
      # `workers versions create` ships a new version of the existing
      # Worker without changing the live deployment. Cloudflare returns
      # a unique workers.dev preview URL for that version; we parse it
      # out of the command output.
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # pipefail so a failed upload fails the step instead of tee's exit 0.
        run: |
          set -o pipefail
          npx cf workers versions create \
            --message "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}" \
            2>&1 | tee "$RUNNER_TEMP/cf-preview.log"

      - name: Extract preview URL from cf output
        if: github.event_name == 'pull_request'
        id: extract_url
        run: |
          combined=$(cat "$RUNNER_TEMP/cf-preview.log")
          url=$(printf '%s' "$combined" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            url=$(printf '%s' "$combined" | grep -oE 'https://[a-z0-9-]+\.workers\.dev' | head -1)
          fi
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Extracted preview URL: $url"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-preview
          message: |
            ### 🚀 Cloudflare preview

            ${{ steps.extract_url.outputs.url && format('**URL:** {0}', steps.extract_url.outputs.url) || '⚠️ Preview URL not found in cf output. Check the **Upload preview version** step logs for the actual URL.' }}

            Built from commit `${{ github.event.pull_request.head.sha }}`.

            > Note: bindings (D1, KV, AI) are shared with production.
            > Avoid destructive PR tests on real data.
